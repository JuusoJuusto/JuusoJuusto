<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Class Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Admin Panel</h1>

    <div id="login-container">
        <input type="password" id="password-input" placeholder="Enter password">
        <button id="login-button">Login</button>
    </div>

    <div id="admin-content" style="display: none;">
        <h2>Manage Locations</h2>
        <form id="location-form">
            <input type="hidden" id="location-id">
            <input type="text" id="location-name" placeholder="Name" required>
            <select id="location-type" required>
                <option value="classroom">Classroom</option>
                <option value="hallway">Hallway</option>
                <option value="stairs">Stairs</option>
                <option value="elevator">Elevator</option>
                <option value="bathroom">Bathroom</option>
            </select>
            <input type="number" id="location-x" placeholder="X coordinate" required>
            <input type="number" id="location-y" placeholder="Y coordinate" required>
            <button type="submit">Save</button>
        </form>

        <h3>Existing Locations</h3>
        <ul id="location-list"></ul>
    </div>

    <script src="admin.js"></script>
</body>
</html>
